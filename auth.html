<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Crowdsourced PO Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandGreen: {
                            50: '#f0fdf4',
                            600: '#059669',
                            700: '#047857',
                        },
                        brandCyan: {
                            500: '#06b6d4',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center font-sans p-4">
    <div class="bg-white p-8 rounded-xl border border-slate-200 w-full max-w-md shadow-xl relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-brandCyan-500"></div>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-900">Translator</h1>
            <p class="text-slate-500 text-sm mt-1">Collaborative Translation Platform</p>
        </div>

        <div class="flex border-b border-slate-200 mb-6">
            <button id="tab-signin" class="flex-1 pb-3 text-center font-semibold text-brandGreen-600 border-b-2 border-brandGreen-600 transition" onclick="switchMode(false)">Sign In</button>
            <button id="tab-signup" class="flex-1 pb-3 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition" onclick="switchMode(true)">Sign Up</button>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
            <div id="username-container" class="hidden">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Username</label>
                <input type="text" id="auth-username" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-brandCyan-500 focus:border-transparent transition" placeholder="johndoe">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="auth-email" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-brandCyan-500 focus:border-transparent transition" placeholder="name@example.com">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="auth-password" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-brandCyan-500 focus:border-transparent transition" placeholder="••••••••">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold p-3 rounded-lg shadow transition duration-200 mt-2">
                Sign In to Platform
            </button>
        </form>

        <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2 max-w-sm w-full"></div>
    </div>
</body>
</html>
