<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Crowdsourced PO Translator</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind.config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/pages/auth.js"></script>
</head>
<body class="bg-offWhite text-brandGreen-800 min-h-screen flex items-center justify-center font-sans p-4">
    <div class="bg-white p-10 rounded-2xl border border-stone-200/60 w-full max-w-md shadow-xl shadow-stone-200/40 relative overflow-hidden">

        <!-- Cyan top line accent -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-brandCyan-500"></div>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight text-brandGreen-700">Translator</h1>
            <p class="text-stone-400 text-xs tracking-wide uppercase mt-1">Collaborative Translation Platform</p>
        </div>

        <div class="flex border-b border-stone-100 mb-6">
            <button id="tab-signin" type="button" class="flex-1 pb-3 text-center font-semibold text-brandGreen-700 border-b-2 border-brandGreen-700 transition">Sign In</button>
            <button id="tab-signup" type="button" class="flex-1 pb-3 text-center font-medium text-stone-400 border-b-2 border-transparent hover:text-brandGreen-600 transition">Sign Up</button>
        </div>

        <form id="auth-form" class="space-y-4">
            <div id="username-container" class="hidden">
                <label class="block text-[10px] font-bold text-brandGreen-600 uppercase tracking-widest mb-1">Username</label>
                <input type="text" id="auth-username" class="w-full bg-offWhite border border-stone-200 rounded-xl p-3 text-brandGreen-800 focus:outline-none focus:ring-2 focus:ring-brandCyan-500 focus:border-transparent transition" placeholder="johndoe">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-brandGreen-600 uppercase tracking-widest mb-1">Email Address</label>
                <input type="email" id="auth-email" required class="w-full bg-offWhite border border-stone-200 rounded-xl p-3 text-brandGreen-800 focus:outline-none focus:ring-2 focus:ring-brandCyan-500 focus:border-transparent transition" placeholder="name@example.com">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-brandGreen-600 uppercase tracking-widest mb-1">Password</label>
                <input type="password" id="auth-password" required class="w-full bg-offWhite border border-stone-200 rounded-xl p-3 text-brandGreen-800 focus:outline-none focus:ring-2 focus:ring-brandCyan-500 focus:border-transparent transition" placeholder="••••••••">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-brandGreen-700 hover:bg-brandGreen-800 text-white font-medium p-3.5 rounded-xl shadow-md shadow-brandGreen-700/10 transition duration-200 mt-4 text-sm tracking-wide">
                Sign In to Platform
            </button>
        </form>
    </div>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2 max-w-sm w-full"></div>
</body>
</html>
