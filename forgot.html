<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - Translator</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind.config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/pages/forgot.js"></script>
</head>
<body class="bg-offWhite text-brandGreen-800 min-h-screen flex items-center justify-center font-sans p-4">
    <div class="bg-white p-10 rounded-2xl border border-stone-200/60 w-full max-w-md shadow-xl shadow-stone-200/40 relative overflow-hidden">

        <div class="absolute top-0 left-0 right-0 h-1 bg-brandCyan-500"></div>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight text-brandGreen-700">Récupération</h1>
            <p class="text-stone-400 text-xs tracking-wide uppercase mt-1">Saisissez votre e-mail pour recevoir un lien</p>
        </div>

        <form id="forgot-form" class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-brandGreen-600 uppercase tracking-widest mb-1">Email Address</label>
                <input type="email" id="forgot-email" required class="w-full bg-offWhite border border-stone-200 rounded-xl p-3 text-brandGreen-800 focus:outline-none focus:ring-2 focus:ring-brandCyan-500 focus:border-transparent transition" placeholder="name@example.com">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-brandGreen-700 hover:bg-brandGreen-800 text-white font-medium p-3.5 rounded-xl shadow-md shadow-brandGreen-700/10 transition duration-200 mt-4 text-sm tracking-wide">
                Envoyer le lien de réinitialisation
            </button>

            <div class="text-center mt-4">
                <a href="auth.html" class="text-xs font-semibold text-brandGreen-600 hover:text-brandGreen-700 transition">Retour à la connexion</a>
            </div>
        </form>
    </div>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2 max-w-sm w-full"></div>
</body>
</html>
